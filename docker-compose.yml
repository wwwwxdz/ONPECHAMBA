services:
  onpe-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onpe-alertas-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/30 * * * *}
      - ONPE_ID_ODP=${ONPE_ID_ODP:-85}
      - ONPE_ODP_NOMBRE=${ONPE_ODP_NOMBRE:-SANTA}
      - DATA_PATH=/app/data/seen_ids.json
    volumes:
      - onpe_bot_data:/app/data

volumes:
  onpe_bot_data:
    driver: local
